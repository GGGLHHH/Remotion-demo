catalogMode: prefer
ignoreWorkspaceRootCheck: true
# 关掉发布冷却期:靠 minimumReleaseAgeExclude 逐版本开洞的话,每次升级都要回来补版本号,
# 漏补的症状是「新发布的库版本装不下来」。代价:冷却期本是防「刚发布的恶意/被劫持版本」的
# 供应链缓冲,关掉等于对所有依赖都不再等。要收回来就改成分钟数(如 1440)。
minimumReleaseAge: 0
shellEmulator: true
trustPolicy: no-downgrade
# semver@6.3.1(2023-07-10 发布)相对更早的版本丢了 provenance 溯源。
# 只经由 @babel/core 到达 —— eslint-plugin-react-hooks 与 @vitejs/plugin-react 都要它。
trustPolicyExclude:
  - semver@6.3.1

packages:
  - apps/*
  - packages/*

catalogs:
  # 构建 / lint / 发布工具链
  cli:
    '@antfu/eslint-config': ^9.3.0
    '@eslint-react/eslint-plugin': ^5.18.3
    '@tailwindcss/vite': ^4.3.3
    bumpp: ^12.2.0
    eslint: ^10.8.1
    eslint-plugin-better-tailwindcss: ^4.7.0
    eslint-plugin-react-hooks: ^7.1.1
    eslint-plugin-react-refresh: ^0.5.3
    nano-staged: ^1.0.2
    publint: ^0.3.23
    shadcn: ^4.13.1
    simple-git-hooks: ^2.13.1
    tsdown: ^0.22.14
    tsx: ^4.23.11
    typescript: ^6.0.3
    vite: ^8.1.1
  react:
    react: ^19.2.8
    react-dom: ^19.2.8
  # Remotion 全家锁同一 patch 版:渲染器与合成侧版本错开会在渲染期才炸。
  remotion:
    '@remotion/bundler': 4.0.491
    '@remotion/captions': 4.0.491
    '@remotion/gif': 4.0.491
    '@remotion/google-fonts': 4.0.491
    '@remotion/install-whisper-cpp': 4.0.491
    '@remotion/media': 4.0.491
    '@remotion/player': 4.0.491
    '@remotion/renderer': 4.0.491
    mediabunny: ^1.50.8
    remotion: 4.0.491
  server:
    '@aws-sdk/client-s3': ^3.700.0
    '@aws-sdk/s3-request-presigner': ^3.700.0
    '@fastify/cors': ^11.0.0
    '@fastify/multipart': ^10.1.0
    fastify: ^5.10.0
  testing:
    '@vitejs/plugin-react': ^6.0.5
    playwright: ^1.61.1
    vitest: ^4.1.10
  types:
    '@types/node': ^26.2.0
    '@types/react': ^19.2.18
    '@types/react-dom': ^19.2.4
  ui:
    '@base-ui/react': ^1.7.0
    '@fontsource-variable/geist': ^5.2.9
    '@shadcn/react': ^0.2.1
    class-variance-authority: ^0.7.1
    clsx: ^2.1.1
    cmdk: ^1.1.1
    lucide-react: ^1.25.0
    next-themes: ^0.4.6
    sonner: ^2.0.7
    tailwind-merge: ^3.6.0
    tailwindcss: ^4.3.3
    tw-animate-css: ^1.4.0
    zustand: ^5.0.14

allowBuilds:
  esbuild: true
  simple-git-hooks: true
